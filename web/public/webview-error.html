<main><h1>请更新系统 WebView</h1><p>清读需要 Android System WebView 125 或更新版本。更新后重新打开 App，即可使用阅读、文件导入和 PDF 功能。</p><p>如果系统已不能更新 WebView，也可以在较新的手机或浏览器上使用清读网页版。</p><a href="https://play.google.com/store/apps/details?id=com.google.android.webview">查看 Android System WebView</a></main>

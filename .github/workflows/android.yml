name: Android debug APK

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Optional public HTTPS book-service address (never credentials)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_BASE: ${{ inputs.api_base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install web dependencies
        run: npm ci
      - name: Verify reader and API logic
        run: npm test
      - name: Build bundled web application
        run: npm run build
      - name: Sync Android application
        run: npx cap sync android
      - name: Install Android SDK build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint debug APK
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - name: Verify APK signature and archive
        working-directory: web/android
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/qingread-apk-signature.txt"
          cat "$RUNNER_TEMP/qingread-apk-signature.txt"
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QingRead-Android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

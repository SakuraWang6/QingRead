name: Android debug APK

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_base:
        description: 'Optional public HTTPS book-service address (never credentials)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      VITE_API_BASE: ${{ inputs.api_base || vars.QINGREAD_API_BASE }}
      QINGREAD_DEBUG_CERT_SHA256: ff9db7beba4dd6075e1e9f4d09dea86a8353d68811dd84f5d4f7026f1067cb70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore stable personal test signing identity
        env:
          QINGREAD_ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.QINGREAD_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          import sys

          encoded = os.environ.get('QINGREAD_ANDROID_DEBUG_KEYSTORE_B64', '')
          if not encoded:
              sys.exit('Missing repository secret QINGREAD_ANDROID_DEBUG_KEYSTORE_B64. Configure the persistent personal test keystore before building; a new signing identity will not be generated.')
          try:
              data = base64.b64decode(''.join(encoded.split()), validate=True)
          except (ValueError, TypeError):
              sys.exit('QINGREAD_ANDROID_DEBUG_KEYSTORE_B64 is not valid base64.')
          if not data:
              sys.exit('The personal test keystore secret is empty.')
          target = Path(os.environ['RUNNER_TEMP']) / 'qingread-debug.keystore'
          target.write_bytes(data)
          target.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment:
              environment.write(f'QINGREAD_DEBUG_KEYSTORE_PATH={target}\n')
          PY
          if ! keytool -exportcert -keystore "$RUNNER_TEMP/qingread-debug.keystore" -alias androiddebugkey -storepass android -file "$RUNNER_TEMP/qingread-debug.cer" >/dev/null 2>&1; then
            echo 'The personal test keystore must contain alias androiddebugkey and use the standard debug store password android.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys

          certificate = Path(os.environ['RUNNER_TEMP']) / 'qingread-debug.cer'
          fingerprint = hashlib.sha256(certificate.read_bytes()).hexdigest()
          if fingerprint != os.environ['QINGREAD_DEBUG_CERT_SHA256']:
              sys.exit('The keystore certificate does not match the fixed personal test signing identity.')
          print(f'Personal test certificate SHA-256: {fingerprint}')
          PY
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install web dependencies
        run: npm ci
      - name: Verify reader and API logic
        run: npm test
      - name: Build bundled web application
        run: npm run build
      - name: Sync Android application
        run: npx cap sync android
      - name: Install Android SDK build dependencies
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint debug APK
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug lintDebug
      - name: Verify APK signature and archive
        working-directory: web/android
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/qingread-apk-signature.txt"
          cat "$RUNNER_TEMP/qingread-apk-signature.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          result = (Path(os.environ['RUNNER_TEMP']) / 'qingread-apk-signature.txt').read_text()
          fingerprints = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$', result, re.MULTILINE)
          if [value.lower() for value in fingerprints] != [os.environ['QINGREAD_DEBUG_CERT_SHA256']]:
              sys.exit('APK signing identity differs from the fixed personal test certificate. Refusing to publish an incompatible update.')
          print('APK signature matches the fixed personal test signing identity.')
          PY
          unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QingRead-Android-debug
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

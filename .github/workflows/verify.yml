name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify release metadata and bundled license
        run: python3 -m unittest discover -s scripts -p 'test_release_manifest.py' -v
      - name: Test HarmonyOS offline asset packaging
        run: python3 -m unittest discover -s scripts -p 'test_prepare_harmony.py' -v
      - name: Generate Xcode project
        run: python3 scripts/generate-project.py
      - name: Test reading core
        run: bash scripts/verify-core.sh
      - name: Test device refresh safety checks
        run: python3 -m unittest discover -s scripts -p 'test_*refresh*.py' -v
      - name: Test speech cursor, chunking and PCM
        run: |
          swiftc App/ReaderSpeechSupport.swift scripts/test-reader-speech.swift -o .build/reader-speech-tests
          .build/reader-speech-tests
      - name: Build iPhone Simulator app
        run: >-
          xcodebuild build -project QingRead.xcodeproj -scheme QingRead
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO
      - name: Launch simulator app and capture actual UI
        run: python3 scripts/simulator-preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QingRead-simulator-preview
          path: |
            .build/previews/*.png
            .build/previews/*.log
          retention-days: 7
